<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <link rel="icon" type="jpg" href="4x5.jpg" />
    <link rel="stylesheet" href="image-gallery.css" />
  </head>
  <body>
    <div class="image-container" id="img">
      <span style="--i: 1">
        <img src="pexels-pixabay-33109.jpg" />
      </span>
      <span style="--i: 2">
        <img src="mercedes-benz-5120x2880-18946.jpg" />
      </span>
      <span style="--i: 3">
        <img src="christian-cross-ai-3840x2743-11707.jpg" />
      </span>
      <span style="--i: 4">
        <img src="pexels-veeterzy-39811.jpg" />
      </span>
        <span class="a" style="--i: 5">
          <img src="pexels-christian-heitz-285904-842711.jpg" />
        </span>
        <span style="--i: 6">
          <img src="pexels-jplenio-1435075.jpg" />
        </span>
        <span style="--i: 7">
          <img src="pexels-pok-rie-33563-2049422.jpg" />
        </span>
        <span style="--i: 8">
          <img src="pexels-picturemechaniq-1749303.jpg" />
        </span>
      </span>
    </div>
    <div class="btn-container">
      <button class="btn" id="prev">Prev</button>
      <button class="btn" id="next">Next</button>
    </div>

    <script src="image-gallery.js"></script>
  </body>
</html>
